aid: abra
name: Abra
description: 'Abra is a digital asset wealth and treasury management platform founded in 2014 that
  provides institutional-grade services for high-net-worth individuals, institutions, corporations,
  and family offices across all 50 US states. Its products include Vault (segregated-account custody
  built on Fireblocks MPC wallet technology), proprietary Yield strategies on BTC, ETH, SOL and
  stablecoins, crypto-backed loans up to 50% LTV, and institutional treasury management, OTC
  execution, staking, and advisory. The company reports $10B+ in transaction volume and $2.5B+ in
  loans processed, and is backed by Pantera Capital. Abra does not currently publish a public
  developer API, API documentation, or SDK surface; this profile captures its public identity and
  probed domain security.'
